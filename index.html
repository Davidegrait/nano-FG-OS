<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Логіка PHP</title>
</head>
<body>

    <h1>Результат виконання логіки:</h1>
    <pre id="output"></pre>

    <script>
        // Еквівалент логіки з картинки на JavaScript
        let str = "hello"; // string
        let result = (str + " world") + "\n";
        
        let lenght = str.length; // довжина рядка
        
        result += lenght + "\n";
        result += Math.PI + "\n"; // еквівалент M_PI

        const TOKEN = 876875875875;
        str = 'Whats up';
        
        result += str;

        // Виводимо результат на сторінку
        document.getElementById("output").textContent = result;
    </script>

</body>
</html>
